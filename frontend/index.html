<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insurance App | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand-block">
          <div class="brand-icon">🛡️</div>
          <h1>Secure Insurance Hub</h1>
          <p>Protect what matters with flexible plans and instant support.</p>
        </div>

        <form id="loginForm" class="auth-form">
          <h2>Welcome back</h2>
          <div id="message" class="message" aria-live="polite"></div>

          <label>
            Email
            <input type="email" id="email" placeholder="you@example.com" required />
          </label>

          <label>
            Password
            <span class="password-field">
              <input type="password" id="password" placeholder="Enter password" required />
              <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">&#128065;</button>
            </span>
          </label>

          <button type="submit" class="btn btn-primary">Login</button>
          <p class="demo-credentials">Demo: <strong>demo@insurance.com</strong> / <strong>Demo@123</strong></p>
          <p class="helper-text">
            Don’t have an account?
            <a href="register.html">Register</a>
          </p>
        </form>
      </div>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
